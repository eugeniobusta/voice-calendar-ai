<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Voice Cal">
    <title>Voice Calendar</title>

    <!-- UI/UX Pro Max: Geometric Modern pairing — Outfit (headings) + DM Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet">

    <style>
        /* ── UI/UX Pro Max: Dark Mode OLED + Voice-First Multimodal ─────────
           Colors: Productivity Tool palette — teal #0D9488, orange #F97316
           Typography: Outfit (headings) + DM Sans (body)
           Style: Voice waveform visualization, listening pulse, minimal chrome
        ──────────────────────────────────────────────────────────────────── */

        :root {
            --bg-deep:       #070B14;
            --bg-card:       rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.06);
            --border:        rgba(255, 255, 255, 0.08);
            --border-focus:  rgba(13, 148, 136, 0.5);
            --teal:          #0D9488;
            --teal-light:    #14B8A6;
            --teal-dim:      rgba(13, 148, 136, 0.15);
            --orange:        #F97316;
            --red-rec:       #EF4444;
            --text-primary:  #F1F5F9;
            --text-secondary:#94A3B8;
            --text-muted:    #475569;
            --success:       #10B981;
            --error:         #F87171;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            min-height: 100vh;
            background: var(--bg-deep);
        }

        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            color: var(--text-primary);
            /* Subtle radial glow in top-left corner */
            background-image:
                radial-gradient(ellipse 800px 600px at -10% -10%, rgba(13,148,136,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 600px 500px at 110% 110%, rgba(249,115,22,0.06) 0%, transparent 60%);
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 20px 60px;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        /* ── Header ──────────────────────────────────────────────────────── */
        .header {
            margin-bottom: 36px;
        }

        .logo-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--teal), var(--teal-light));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            box-shadow: 0 0 20px rgba(13,148,136,0.35);
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            /* Gradient text */
            background: linear-gradient(135deg, #F1F5F9 30%, var(--teal-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 400;
            margin-left: 46px;
        }

        /* ── Glass card ──────────────────────────────────────────────────── */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 12px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            transition: border-color 0.2s;
        }

        .card:focus-within {
            border-color: var(--border-focus);
        }

        .label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        /* ── Password ────────────────────────────────────────────────────── */
        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="password"] {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 16px;
            font-family: inherit;
            color: var(--text-primary);
            letter-spacing: 2px;
        }

        input[type="password"]::placeholder {
            color: var(--text-muted);
            letter-spacing: 0;
        }

        .lock-icon {
            font-size: 16px;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .lock-icon.unlocked { color: var(--teal); }

        /* ── Voice recorder card ─────────────────────────────────────────── */
        .recorder-card {
            text-align: center;
            padding: 32px 20px 24px;
        }

        /* Waveform visualization — 5 bars that animate when recording */
        .waveform {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            height: 40px;
            margin-bottom: 28px;
        }

        .waveform-bar {
            width: 3px;
            border-radius: 2px;
            background: var(--teal);
            opacity: 0.25;
            height: 8px;
            transition: opacity 0.3s;
        }

        /* When recording: bars animate at different heights and speeds */
        .recording .waveform-bar {
            opacity: 1;
            animation: wave 1s ease-in-out infinite;
        }

        .recording .waveform-bar:nth-child(1) { animation-delay: 0.0s; }
        .recording .waveform-bar:nth-child(2) { animation-delay: 0.1s; }
        .recording .waveform-bar:nth-child(3) { animation-delay: 0.2s; }
        .recording .waveform-bar:nth-child(4) { animation-delay: 0.3s; }
        .recording .waveform-bar:nth-child(5) { animation-delay: 0.4s; }
        .recording .waveform-bar:nth-child(6) { animation-delay: 0.15s; }
        .recording .waveform-bar:nth-child(7) { animation-delay: 0.25s; }

        @keyframes wave {
            0%, 100% { height: 6px; }
            50%       { height: 32px; }
        }

        /* The microphone button */
        .mic-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        /* Animated ring that pulses when recording */
        .mic-ring {
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid var(--red-rec);
            opacity: 0;
            transform: scale(1);
        }

        .recording .mic-ring {
            animation: ring-pulse 1.6s ease-out infinite;
        }

        @keyframes ring-pulse {
            0%   { opacity: 0.6; transform: scale(1); }
            100% { opacity: 0;   transform: scale(1.6); }
        }

        .mic-btn {
            position: relative;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: transform 0.15s, box-shadow 0.15s;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            background: linear-gradient(135deg, #EF4444, #DC2626);
            box-shadow: 0 4px 24px rgba(239, 68, 68, 0.4);
        }

        .recording .mic-btn {
            background: linear-gradient(135deg, #DC2626, #B91C1C);
            box-shadow: 0 4px 32px rgba(239, 68, 68, 0.6);
        }

        .mic-btn:active { transform: scale(0.92); }

        .mic-label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .recording .mic-label {
            color: var(--red-rec);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0 16px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider-text {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ── Textarea ────────────────────────────────────────────────────── */
        textarea {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            color: var(--text-primary);
            resize: none;
            line-height: 1.6;
            min-height: 72px;
        }

        textarea::placeholder { color: var(--text-muted); }

        /* ── Submit button ───────────────────────────────────────────────── */
        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--teal) 0%, var(--teal-light) 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            letter-spacing: 0.2px;
            transition: opacity 0.15s, transform 0.15s;
            box-shadow: 0 4px 24px rgba(13, 148, 136, 0.35);
            -webkit-tap-highlight-color: transparent;
        }

        .submit-btn:active  { opacity: 0.85; transform: scale(0.99); }
        .submit-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

        /* ── Loading ─────────────────────────────────────────────────────── */
        .loading-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 20px;
        }

        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(13, 148, 136, 0.25);
            border-top-color: var(--teal);
            border-radius: 50%;
            animation: spin 0.65s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* ── Results ─────────────────────────────────────────────────────── */
        .transcript-box {
            font-size: 13px;
            color: var(--text-secondary);
            font-style: italic;
            background: rgba(13, 148, 136, 0.06);
            border: 1px solid rgba(13, 148, 136, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .result-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }

        .result-item:first-child { padding-top: 2px; }
        .result-item:last-child  { border-bottom: none; padding-bottom: 2px; }

        .result-icon {
            width: 40px; height: 40px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .result-icon.event { background: var(--teal-dim); }
        .result-icon.task  { background: rgba(249,115,22,0.12); }

        .result-info { flex: 1; min-width: 0; }

        .result-title {
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .result-detail {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .result-calendar {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            background: var(--teal-dim);
            color: var(--teal-light);
            border-radius: 6px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Error */
        .error-card {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 14px;
            padding: 16px;
            color: var(--error);
            font-size: 14px;
            line-height: 1.5;
        }

        .hidden { display: none; }
    </style>
</head>
<body>
<div class="page">
<div class="container">

    <!-- Header -->
    <div class="header">
        <div class="logo-row">
            <div class="logo-icon">🎙</div>
            <h1>Voice Calendar</h1>
        </div>
        <p class="subtitle">Speak or type — events appear instantly</p>
    </div>

    <!-- Password -->
    <div class="card">
        <p class="label">Password</p>
        <div class="input-row">
            <input type="password" id="secretInput"
                   placeholder="Enter password"
                   autocomplete="current-password">
            <span class="lock-icon" id="lockIcon">🔒</span>
        </div>
    </div>

    <!-- Recorder + Text input -->
    <div class="card recorder-card" id="recorderCard">

        <!-- Waveform visualization — animates during recording -->
        <div class="waveform">
            <div class="waveform-bar"></div>
            <div class="waveform-bar"></div>
            <div class="waveform-bar"></div>
            <div class="waveform-bar"></div>
            <div class="waveform-bar"></div>
            <div class="waveform-bar"></div>
            <div class="waveform-bar"></div>
        </div>

        <!-- Mic button with animated ring -->
        <div class="mic-wrap">
            <div class="mic-ring"></div>
            <button class="mic-btn" id="micBtn" onclick="toggleRecord()">🎤</button>
        </div>
        <p class="mic-label" id="micLabel">Tap to record</p>

        <!-- Divider -->
        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">or type below</span>
            <div class="divider-line"></div>
        </div>

        <p class="label">Your message</p>
        <textarea id="textInput" rows="3"
            placeholder="e.g. Dentist Thursday 2pm, gym every Monday 7am…"
        ></textarea>
    </div>

    <!-- Submit -->
    <button class="submit-btn" id="submitBtn" onclick="handleSubmit()">
        Add to Calendar →
    </button>

    <!-- Loading -->
    <div class="hidden card loading-card" id="loadingEl">
        <div class="spinner"></div>
        <span class="loading-text">Processing your message…</span>
    </div>

    <!-- Results -->
    <div class="hidden" id="resultsEl"></div>

</div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────
let mediaRecorder = null;
let audioChunks   = [];
let isRecording   = false;
let recordedBlob  = null;
let recordedMime  = '';

// ── Persist password ──────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('vcal_secret');
    if (saved) document.getElementById('secretInput').value = saved;
});

document.getElementById('secretInput').addEventListener('input', () => {
    const val = document.getElementById('secretInput').value;
    localStorage.setItem('vcal_secret', val);
    document.getElementById('lockIcon').textContent = val ? '🔓' : '🔒';
    document.getElementById('lockIcon').className = 'lock-icon' + (val ? ' unlocked' : '');
});

// ── Recording ─────────────────────────────────────────────────────────────
async function toggleRecord() {
    isRecording ? stopRecording() : await startRecording();
}

async function startRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        const mimeType =
            MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' :
            MediaRecorder.isTypeSupported('audio/webm')              ? 'audio/webm' : 'audio/mp4';

        mediaRecorder = new MediaRecorder(stream, { mimeType });
        audioChunks   = [];

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            recordedMime = mimeType;
            recordedBlob = new Blob(audioChunks, { type: mimeType });
            stream.getTracks().forEach(t => t.stop());
            onRecordingReady();
        };

        mediaRecorder.start(200);
        isRecording = true;
        setRecordingUI(true);

    } catch {
        alert('Microphone access denied.\n\nAllow microphone access in your browser settings, then refresh.');
    }
}

function stopRecording() {
    if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
    }
}

function setRecordingUI(on) {
    const card  = document.getElementById('recorderCard');
    const btn   = document.getElementById('micBtn');
    const label = document.getElementById('micLabel');

    card.classList.toggle('recording', on);
    btn.textContent  = on ? '⏹' : '🎤';
    label.textContent = on ? 'Recording — tap to stop' : 'Tap to record';
}

function onRecordingReady() {
    setRecordingUI(false);
    document.getElementById('micLabel').textContent = '✓ Recording ready';
    document.getElementById('micLabel').style.color = 'var(--teal-light)';
    document.getElementById('textInput').value = '';
}

// ── Submit ────────────────────────────────────────────────────────────────
async function handleSubmit() {
    const text   = document.getElementById('textInput').value.trim();
    const secret = document.getElementById('secretInput').value.trim();

    if (!text && !recordedBlob) {
        alert('Record a voice note or type a message first.');
        return;
    }

    setLoading(true);
    clearResults();

    try {
        const form = new FormData();

        if (recordedBlob) {
            const ext = recordedMime.includes('mp4') ? 'm4a' : 'webm';
            form.append('audio', recordedBlob, `recording.${ext}`);
        } else {
            form.append('text', text);
        }

        form.append('timezone', Intl.DateTimeFormat().resolvedOptions().timeZone);
        if (secret) form.append('secret', secret);

        const res  = await fetch('/parse', { method: 'POST', body: form });
        const data = await res.json();

        if (!res.ok || data.error) throw new Error(data.error || 'Unknown error');

        renderResults(data);

        // Reset
        recordedBlob = null;
        document.getElementById('textInput').value = '';
        document.getElementById('micLabel').textContent = 'Tap to record';
        document.getElementById('micLabel').style.color = '';

    } catch (err) {
        renderError(err.message);
    } finally {
        setLoading(false);
    }
}

// ── Rendering ─────────────────────────────────────────────────────────────
function setLoading(show) {
    document.getElementById('loadingEl').classList.toggle('hidden', !show);
    document.getElementById('submitBtn').disabled = show;
}

function clearResults() {
    const el = document.getElementById('resultsEl');
    el.innerHTML = '';
    el.classList.add('hidden');
}

function renderResults(data) {
    const el = document.getElementById('resultsEl');
    el.classList.remove('hidden');

    let html = '';

    if (data.transcript) {
        html += `<div class="transcript-box">"${esc(data.transcript)}"</div>`;
    }

    if (!data.created || data.created.length === 0) {
        html += `<div class="card" style="text-align:center;padding:28px;color:var(--text-secondary)">
                   No events found.<br>
                   <small style="color:var(--text-muted)">Try including a date or time.</small>
                 </div>`;
    } else {
        html += '<div class="card">';
        for (const item of data.created) {
            const isEvent = item.type === 'event';
            const icon    = isEvent ? '📅' : '📋';
            const cls     = isEvent ? 'event' : 'task';

            let detail = '';
            if (isEvent) {
                if (item.date) detail += item.date;
                if (item.time) detail += ` · ${item.time}`;
                if (item.location) detail += ` · ${esc(item.location)}`;
            } else {
                detail = item.deadline ? `Due ${item.deadline}` : 'No deadline set';
            }

            const calBadge = item.calendar
                ? `<span class="result-calendar">${esc(item.calendar)}</span>` : '';

            html += `
              <div class="result-item">
                <div class="result-icon ${cls}">${icon}</div>
                <div class="result-info">
                  <div class="result-title">${esc(item.title)}</div>
                  <div class="result-detail">${detail}</div>
                </div>
                ${calBadge}
              </div>`;
        }
        html += '</div>';
    }

    el.innerHTML = html;
}

function renderError(msg) {
    const el = document.getElementById('resultsEl');
    el.classList.remove('hidden');
    el.innerHTML = `<div class="error-card">⚠ ${esc(msg)}</div>`;
}

function esc(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
